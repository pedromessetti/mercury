# Mercury CI Pipeline — Build Verification
#
# Triggers:
#   - Automatically on every Pull Request
#   - Manually via workflow_dispatch (select which targets to build)
#
# Builds:
#   - Linux amd64 (native, Debian 13)
#   - Linux arm64 (cross-compile, Debian 13)
#   - Windows x64 (cross-compile via MinGW, Debian 13)
#
# All build logs are uploaded as artifacts for review.

name: CI

on:
  pull_request:
    branches: [mercuryv2, develop]
  workflow_dispatch:
    inputs:
      build_linux_amd64:
        description: 'Build Linux amd64'
        type: boolean
        default: true
      build_linux_arm64:
        description: 'Build Linux arm64 (cross-compile)'
        type: boolean
        default: true
      build_windows:
        description: 'Build Windows x64 (cross-compile)'
        type: boolean
        default: true

jobs:
  build-linux-amd64:
    name: Build Linux amd64 (Debian 13)
    runs-on: ubuntu-latest
    container: debian:trixie
    if: >-
      github.event_name == 'pull_request' ||
      github.event.inputs.build_linux_amd64 == 'true'
    timeout-minutes: 30

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            git \
            libpulse-dev \
            libasound2-dev

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Mercury (Linux amd64)
        run: |
          make clean
          make -j$(nproc) 2>&1 | tee build-linux-amd64.log
          echo "BUILD_EXIT_CODE=${PIPESTATUS[0]}" >> "$GITHUB_ENV"

      - name: Check build result
        run: |
          if [ "$BUILD_EXIT_CODE" != "0" ]; then
            echo "::error::Linux amd64 build failed"
            exit 1
          fi
          echo "Linux amd64 build succeeded"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-linux-amd64
          path: build-linux-amd64.log
          retention-days: 30

  build-linux-arm64:
    name: Build Linux arm64 (cross-compile, Debian 13)
    runs-on: ubuntu-latest
    container: debian:trixie
    if: >-
      github.event_name == 'pull_request' ||
      github.event.inputs.build_linux_arm64 == 'true'
    timeout-minutes: 30

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            git \
            gcc-aarch64-linux-gnu

      - name: Enable arm64 multiarch
        run: |
          dpkg --add-architecture arm64
          apt-get update
          apt-get install -y --no-install-recommends \
            libpulse-dev:arm64 \
            libasound2-dev:arm64

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Mercury (Linux arm64 cross-compile)
        run: |
          make clean
          make -j$(nproc) CC=aarch64-linux-gnu-gcc 2>&1 | tee build-linux-arm64.log
          echo "BUILD_EXIT_CODE=${PIPESTATUS[0]}" >> "$GITHUB_ENV"

      - name: Check build result
        run: |
          if [ "$BUILD_EXIT_CODE" != "0" ]; then
            echo "::error::Linux arm64 cross-compile failed"
            exit 1
          fi
          echo "Linux arm64 cross-compile succeeded"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-linux-arm64
          path: build-linux-arm64.log
          retention-days: 30

  build-windows:
    name: Build Windows x64 (cross-compile, Debian 13)
    runs-on: ubuntu-latest
    container: debian:trixie
    if: >-
      github.event_name == 'pull_request' ||
      github.event.inputs.build_windows == 'true'
    timeout-minutes: 30

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            git \
            gcc-mingw-w64-x86-64

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Mercury (Windows x64 cross-compile)
        run: |
          make windows 2>&1 | tee build-windows-x64.log
          echo "BUILD_EXIT_CODE=${PIPESTATUS[0]}" >> "$GITHUB_ENV"

      - name: Check build result
        run: |
          if [ "$BUILD_EXIT_CODE" != "0" ]; then
            echo "::error::Windows x64 cross-compile failed"
            exit 1
          fi
          echo "Windows x64 cross-compile succeeded"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-windows-x64
          path: build-windows-x64.log
          retention-days: 30
